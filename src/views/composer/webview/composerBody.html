<body>
	<header>
		<h1>Composer</h1>
		<button type="button" class="ghost" id="select-kb">Select Knowledge Base</button>
	</header>
	<div class="layout">
		<div class="center composer">
			<p class="page-title">Draft a note</p>
			<p class="page-sub">Capture from the editor or write here, then use Storage to place it in the knowledge base.</p>
			<p id="kb-root" class="meta kb-path">Knowledge base: not selected</p>

			<section class="field">
				<label for="heading-title">Heading title</label>
				<input id="heading-title" type="text" placeholder="Topic" autocomplete="off" />
			</section>

			<section class="field">
				<label for="metadata">Metadata</label>
				<div id="metadata" class="metadata-chips">
					<div id="chips"></div>
				</div>
			</section>

			<section class="field field-body">
				<label for="body">Body</label>
				<textarea id="body" spellcheck="true" placeholder="Notes under this heading…"></textarea>
			</section>

			<div class="button-row">
				<div class="button-row-center">
					<button type="button" class="ghost" id="save-draft">Save Draft</button>
					<button type="button" class="ghost" id="ingest-note">Ingest Note</button>
					<button type="button" class="ghost danger" id="delete-draft" hidden title="Delete this saved draft">Delete Draft</button>
				</div>
				<button type="button" class="ghost button-row-end" id="new-note">New Note</button>
			</div>
			<div id="status" class="status"></div>
			<div id="error" class="error"></div>
		</div>
	</div>
</body>
