<body>
	<div class="storage-root" id="storage-root">
			<div class="storage-corpus-strip" aria-label="Storage corpus">
				<label for="st-corpus">Corpus</label>
				<div class="storage-corpus-row">
					<select id="st-corpus" aria-label="Suggestion corpus">
						<option value="working" selected>Working set (.dripignore)</option>
						<option value="entire">Entire KB</option>
						<option value="custom">Custom paths…</option>
					</select>
					<button type="button" class="secondary storage-corpus-edit hidden" id="st-corpus-edit" title="Change custom paths" hidden>Edit</button>
				</div>
			</div>
			<div id="st-custom-corpus" class="storage-custom-corpus" hidden>
				<p class="meta storage-custom-sub">Add files/folders from inside the .driplock KB only. Session-only (not saved).</p>
				<div class="storage-custom-toolbar">
					<button type="button" class="secondary" id="st-custom-add">Add files or folders…</button>
				</div>
				<ul id="st-custom-entries" class="storage-custom-entries"></ul>
				<p id="st-custom-empty" class="meta">No paths yet.</p>
				<div class="storage-custom-footer">
					<button type="button" class="secondary" id="st-custom-cancel">Cancel</button>
					<button type="button" id="st-custom-done">Done</button>
				</div>
			</div>
			<div class="storage-toolbar-actions">
				<button id="suggestions-btn" type="button">Suggestions</button>
				<button type="button" class="secondary" id="ai-paths-btn" title="Top 4 folders, files or headings from the stored embeddings">AI</button>
				<button type="button" class="secondary" id="btn-custom-select">Browse</button>
				<button type="button" class="secondary" id="llm-suggest-btn" title="Let your LLM (DRIP Settings → Lightweight LLM) choose where this note goes">Suggest with LLM</button>
			</div>
			<div id="error" class="error"></div>
			<div id="llm-plan-panel" class="llm-plan-panel" hidden></div>
			<div id="storage-main-panel">
			<div id="storage-path-bar" class="storage-path-bar" aria-label="Storage path"></div>
			<div id="selection-controls" class="selection-inline"></div>
			<div class="row storage-flow" id="suggestions-flow">
				<p id="suggestions-hint" class="storage-section-hint meta" hidden></p>
				<div id="suggested-folders"></div>
				<div id="suggested-files-wrap" hidden>
					<div id="suggested-files"></div>
				</div>
				<div id="suggested-headings-wrap" hidden>
					<div class="heading-tree-toolbar">
						<span class="meta" style="margin:0;font-size:11px;">Headings</span>
						<button type="button" id="ht-expand-flow">Expand all</button>
						<button type="button" id="ht-collapse-flow">Collapse all</button>
						<button type="button" id="ht-refresh-flow" class="secondary">Refresh</button>
						<label class="ht-persistent-toggle" title="Show only persistent (# .…) headings"><input type="checkbox" class="ht-persistent-only" /> Persistent only</label>
					</div>
					<div class="ht-tree-resize-wrap">
					<div id="heading-tree" class="heading-tree"></div>
						<div class="ht-tree-resize-grip" id="heading-tree-resize-grip" role="separator" aria-orientation="horizontal" aria-label="Resize headings list height"></div>
				</div>
			</div>
			</div>
			<div id="ai-paths-panel" class="row storage-flow" hidden>
				<div id="ai-paths-list"></div>
			</div>
			<div id="custom-picker" class="picker-panel" hidden>
				<div class="picker-breadcrumb" id="picker-breadcrumb"></div>
				<div id="picker-explore-body">
				<p class="picker-search-label">Search this folder</p>
				<input type="text" class="picker-filter" id="picker-filter" placeholder="Filter files and folders…" />
				<div class="picker-list" id="picker-list"></div>
				</div>
				<div id="picker-heading-wrap" hidden style="margin-top:10px;">
					<div class="heading-tree-toolbar">
						<span class="meta" style="margin:0;font-size:11px;">Headings</span>
						<button type="button" id="ht-expand-picker">Expand all</button>
						<button type="button" id="ht-collapse-picker">Collapse all</button>
						<button type="button" id="ht-refresh-picker" class="secondary">Refresh</button>
						<label class="ht-persistent-toggle" title="Show only persistent (# .…) headings"><input type="checkbox" class="ht-persistent-only" /> Persistent only</label>
					</div>
					<div class="ht-tree-resize-wrap">
					<div id="picker-heading-tree" class="heading-tree"></div>
						<div class="ht-tree-resize-grip" id="picker-heading-tree-resize-grip" role="separator" aria-orientation="horizontal" aria-label="Resize headings list height"></div>
				</div>
			</div>
			</div>
			<div id="shared-folder-actions" class="shared-folder-actions" hidden>
				<div class="create-row">
					<label for="shared-new-folder-name">New folder</label>
					<input type="text" id="shared-new-folder-name" placeholder="Folder name" autocomplete="off" />
					<button type="button" id="shared-create-folder" class="secondary">Create</button>
				</div>
				<div class="create-row">
					<label for="shared-new-file-name">New file</label>
					<input type="text" id="shared-new-file-name" placeholder="Note title" autocomplete="off" />
					<button type="button" id="shared-create-file">Create</button>
				</div>
			</div>
			<div class="storage-actions">
				<div class="storage-actions-buttons">
					<button id="save-draft-storage" type="button" class="secondary">Save draft</button>
					<button id="ingest-note-storage" type="button">Ingest</button>
				</div>
				<div id="storage-status" class="storage-status-below" aria-live="polite"></div>
			</div>
			</div>
	</div>

	<div id="issue-move-panel" hidden>
		<div class="im-head">
			<div class="im-title">
				<span class="im-project-name" id="im-project-name"></span>
				<span class="im-issue-line" id="im-issue-line"></span>
			</div>
		</div>
		<div class="im-toolbar">
			<button type="button" id="im-suggest">Suggestions</button>
			<button type="button" class="secondary" id="im-ai" title="Top matches from stored embeddings">AI</button>
			<button type="button" class="secondary" id="im-browse" title="Browse the project structure">Browse</button>
		</div>
		<div class="im-query" id="im-query" hidden></div>
		<div class="im-crumbs" id="im-crumbs"></div>
		<div class="im-list" id="im-list"></div>
		<div class="im-options">
			<label class="im-check" id="im-persistent-wrap" hidden>
				<input type="checkbox" id="im-persistent-only" /> Persistent only
			</label>
			<label class="im-check">
				<input type="checkbox" id="im-remove-parent" /> Remove parent / hierarchy
			</label>
			<span class="im-hint" id="im-parent-hint" hidden>This issue has a parent. Check "Remove parent" to place it under another issue or anywhere.</span>
		</div>
		<div class="im-error" id="im-error" hidden></div>
		<div class="im-actions">
			<span class="im-selection" id="im-selection"></span>
			<button type="button" class="secondary" id="im-cancel" title="Cancel move">Cancel</button>
			<button type="button" id="im-move" disabled>Move</button>
		</div>
	</div>
