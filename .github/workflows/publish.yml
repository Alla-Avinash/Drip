# Publishes DRIP to the VS Code Marketplace, one platform at a time.
#
# DRIP depends on better-sqlite3, a native module. It must be rebuilt against
# VS Code's Electron ABI (not system Node) on each platform, otherwise it fails
# to load at runtime with a NODE_MODULE_VERSION mismatch.
#
# max-parallel: 1 serializes the publishes — the Marketplace rejects concurrent
# publishes of the same version. fail-fast: false keeps one platform's failure
# from cancelling the others.
#
# Trigger: run manually from the Actions tab, or push a `v*` tag.

name: Publish to Marketplace

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
          - target: linux-x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read Electron version
        id: electron
        shell: bash
        run: echo "version=$(cat .electron-version)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build webview assets
        run: npm run build:webview

      - name: Rebuild better-sqlite3 for VS Code Electron
        run: npx @electron/rebuild -v ${{ steps.electron.outputs.version }} -w better-sqlite3

      - name: Drop stale Node-ABI prebuild
        shell: bash
        run: rm -rf node_modules/better-sqlite3/prebuilds

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --target ${{ matrix.target }} --no-dependencies --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
