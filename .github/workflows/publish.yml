# Publishes DRIP to the VS Code Marketplace, one platform at a time.
#
# DRIP depends on better-sqlite3, a native module. It must be rebuilt against
# VS Code's Electron ABI (not system Node) on each platform, otherwise it fails
# to load at runtime with a NODE_MODULE_VERSION mismatch.
#
# Trigger: run manually from the Actions tab, or push a `v*` tag.

name: Publish to Marketplace

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Electron 43.7.7 = VS Code 1.140–1.142 (Node 24.21.0).
          # Bump ELECTRON_VERSION when VS Code ships a new Electron major.
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-13          # Intel Macs
          - target: darwin-arm64
            os: macos-14          # Apple Silicon
          - target: linux-x64
            os: ubuntu-latest

    env:
      ELECTRON_VERSION: 43.7.7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for VS Code Electron
        run: npx @electron/rebuild -v ${{ env.ELECTRON_VERSION }} -m better-sqlite3

      - name: Drop stale Node-ABI prebuild
        shell: bash
        run: rm -rf node_modules/better-sqlite3/prebuilds

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --target ${{ matrix.target }} --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
