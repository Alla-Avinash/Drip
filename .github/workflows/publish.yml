# Publishes DRIP to the VS Code Marketplace, one platform at a time.
#
# DRIP depends on better-sqlite3, a native module. better-sqlite3 v13 is a
# N-API addon, so its shipped prebuilt binaries (prebuilds/*.node) are
# ABI-stable and load in VS Code's Electron directly — no rebuild is needed.
# We ship the prebuilds as-installed and must NOT delete them.
#
# max-parallel: 1 serializes the publishes — the Marketplace rejects concurrent
# publishes of the same version. fail-fast: false keeps one platform's failure
# from cancelling the others.
#
# Trigger: run manually from the Actions tab, or push a `v*` tag.

name: Publish to Marketplace

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-13
          - target: darwin-arm64
            os: macos-14
          - target: linux-x64
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build webview assets
        run: npm run build:webview

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Publish to Marketplace
        run: npx @vscode/vsce publish --target ${{ matrix.target }} --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
